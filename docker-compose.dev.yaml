version: "3.9"
services:
    user_service_psql:
        image: postgres:17-alpine
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=lifeat_user_service_psql
        restart: always
        volumes:
            - ./db/user_service:/var/lib/postgresql/data

    catalog_service_psql:
        image: postgres:17-alpine
        ports:
            - "5433:5432"
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=lifeat_catalog_service_psql
        restart: always
        volumes:
            - ./db/catalog_service:/var/lib/postgresql/data

    order_service_psql:
        image: postgres:17-alpine
        ports:
            - "5434:5432"
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=lifeat_order_service_psql
        restart: always
        volumes:
            - ./db/order_service:/var/lib/postgresql/data

    payment_service_psql:
        image: postgres:17-alpine
        ports:
            - "5435:5432"
        environment:
            - POSTGRES_USER=root
            - POSTGRES_PASSWORD=secret
            - POSTGRES_DB=lifeat_payment_service_psql
        restart: always
        volumes:
            - ./db/payment_service:/var/lib/postgresql/data

    notification_service_mongod:
        image: mongo:latest
        restart: always
        ports:
            - "27017:27017"
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=secret
            - MONGO_INITDB_DATABASE=lifeat_notify_service_mongod
        volumes:
            - ./db/notification_service:/data/db

    redis:
        image: redis:7-alpine
        restart: always
        ports:
            - "6379:6379"

    zookeeper:
        image: docker.io/bitnami/zookeeper:3.9
        ports:
            - "2181:2181"
        environment:
            - ALLOW_ANONYMOUS_LOGIN=yes

    kafka:
        image: "bitnami/kafka:latest"
        ports:
            - "9092:9092"
        environment:
            - KAFKA_BROKER_ID=1
            - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092
            - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
            - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
            - ALLOW_PLAINTEXT_LISTENER=yes
        depends_on:
            - zookeeper
